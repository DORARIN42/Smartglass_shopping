<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>Shoply — 글라스 디스플레이 600×600</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
<style>
/* ============================================================
   Glasses display mockup — 600×600
   Meta Wearables Display SDK 프리셋 CSS 근사:
     TextStyle  HEADING=28px/700  BODY=18px/400  META=13px/400
     TextColor  PRIMARY=rgba(255,255,255,.95)  SECONDARY=rgba(255,255,255,.50)
     FlexBoxBackground.CARD = rgba(255,255,255,.12) + blur + border
     CornerRadius NONE=0 SMALL=8px MEDIUM=16px
   실제 SDK 렌더링과 다를 수 있음 — 레이아웃·구조 검토용 목업.
   ============================================================ */

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  gap: 12px;
  background: #0e0e0e;
  font-family: 'Inter', sans-serif;
  padding: 16px 0 0;
}

/* ── Tab bar ────────────────────────────────────────────── */
.tabs {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  justify-content: center;
}
.tab {
  padding: 7px 16px;
  border-radius: 99px;
  background: transparent;
  border: 1px solid #333;
  color: #666;
  font-size: 12px;
  font-family: inherit;
  cursor: pointer;
  transition: background 160ms, color 160ms, border-color 160ms;
}
.tab:hover { color: #ccc; border-color: #555; }
.tab.active { background: #222; color: #fff; border-color: #555; }

/* ── Outer wrapper ─────────────────────────────────────── */
.wrapper {
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* ── 600×600 display viewport ───────────────────────────── */
.display {
  width: 600px;
  height: 600px;
  overflow: hidden;
  position: relative;
}

/* Background: simulates looking through the AR glasses lens */
.display-bg {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse at 30% 40%, rgba(20,40,20,.6) 0%, transparent 60%),
    radial-gradient(ellipse at 70% 60%, rgba(10,20,40,.6) 0%, transparent 60%),
    #080c10;
}
/* CRT-style scanlines — subtle AR texture */
.display-bg::after {
  content: '';
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(
    0deg, transparent, transparent 2px,
    rgba(0,0,0,.06) 2px, rgba(0,0,0,.06) 3px
  );
  pointer-events: none;
}

/* Content layer — SDK renders here */
.display-inner {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px;
}

/* ── SDK primitives ─────────────────────────────────────── */

/* FlexBoxBackground.CARD */
.sdk-card {
  background: rgba(255,255,255,.10);
  border: 1px solid rgba(255,255,255,.14);
  border-radius: 16px;                /* CornerRadius.MEDIUM */
  padding: 24px;
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  width: 100%;
}

/* flexBox direction helpers */
.sdk-col { display: flex; flex-direction: column; }
.sdk-row { display: flex; flex-direction: row; align-items: center; }
.gap4  { gap: 4px; }
.gap8  { gap: 8px; }
.gap12 { gap: 12px; }
.w100  { width: 100%; }
.grow1 { flex: 1 1 0; }

/* TextStyle */
.sdk-heading  { font-size: 28px; font-weight: 700; line-height: 1.25; color: rgba(255,255,255,.95); }
.sdk-body     { font-size: 18px; font-weight: 400; line-height: 1.45; color: rgba(255,255,255,.95); }
.sdk-meta     { font-size: 13px; font-weight: 400; line-height: 1.4;  color: rgba(255,255,255,.95); }

/* TextColor.SECONDARY */
.sdk-secondary { color: rgba(255,255,255,.50); }

/* icon — 28×28, inherits color */
.sdk-icon       { width: 28px; height: 28px; flex-shrink: 0; color: rgba(255,255,255,.90); }
.sdk-icon svg   { width: 100%; height: 100%; }

/* image(sizePreset=FILL) placeholder */
.sdk-img {
  width: 100%;
  height: 130px;
  border-radius: 12px;
  background: rgba(255,255,255,.07);
  border: 1px dashed rgba(255,255,255,.12);
  display: flex;
  align-items: center;
  justify-content: center;
  color: rgba(255,255,255,.20);
  font-size: 12px;
  letter-spacing: 0.04em;
}

/* Price card columns (flexGrow=1 × 3) */
.sdk-price-row {
  display: flex;
  flex-direction: row;
  gap: 8px;
  width: 100%;
}
.sdk-price-card {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 12px;
  background: rgba(255,255,255,.09);
  border: 1px solid rgba(255,255,255,.11);
  border-radius: 12px;
  cursor: pointer;
  transition: background 160ms;
}
.sdk-price-card:hover { background: rgba(255,255,255,.15); }

/* Loading spinner animation */
@keyframes spin { to { transform: rotate(360deg); } }
.spin { animation: spin 1.4s linear infinite; transform-origin: center; }

/* ── Screen visibility ──────────────────────────────────── */
.screen      { display: none; width: 100%; }
.screen.active { display: flex; }
</style>
</head>
<body>

<div class="tabs">
  <button class="tab active" onclick="show('splash',    this)">스플래시 (199:2768)</button>
  <button class="tab"        onclick="show('ready',     this)">준비 완료 (199:2667)</button>
  <button class="tab"        onclick="show('capturing', this)">촬영 중 (199:2680)</button>
  <button class="tab"        onclick="show('captured',  this)">촬영 완료 (199:2863)</button>
  <button class="tab"        onclick="show('loading',   this)">검색 중 (199:3562)</button>
  <button class="tab"        onclick="show('searched',  this)">검색 완료 (199:3013)</button>
  <button class="tab"        onclick="show('matched',   this)">결과 · 매칭</button>
  <button class="tab"        onclick="show('uncertain', this)">결과 · 불확실</button>
  <button class="tab"        onclick="show('retry',     this)">재촬영 요청</button>
  <button class="tab"        onclick="show('error',     this)">오류</button>
</div>

<div class="wrapper">
  <div class="display">
    <div class="display-bg"></div>
    <div class="display-inner">

      <!-- ① showSplashScreen() — Figma 199:2768 ───────────
           flexBox(col, center, center, gap=40) {
             image(logo.png, FILL)
             text("Shop smarter, Spend wiser", BODY, SECONDARY)
           }
      ──────────────────────────────────────────────────── -->
      <div id="screen-splash" class="screen active" style="width:100%; height:100%; align-items:center; justify-content:center; flex-direction:column; gap:40px;">
        <img src="../Shoply_meta_png/logo.png" alt="Shoply" style="width:325px; height:203px; object-fit:contain;" />
        <span class="sdk-body sdk-secondary" style="text-align:center;">Shop smarter, Spend wiser</span>
      </div>

      <!-- ② showReadyScreen() — Figma 199:2667 ───────────
           flexBox(row, gap=32) {
             image(Guideline.png, FILL)          ← left strip
             flexBox(col, gap=32, center, flexGrow=1) {
               image(CameraClear.png, FILL)
               text("왼쪽에 물체를 배치해주세요.", BODY, SECONDARY)
             }
           }
      ──────────────────────────────────────────────────── -->
      <div id="screen-ready" class="screen" style="width:100%; height:100%; flex-direction:row; gap:32px; align-items:center;">
        <!-- Guideline strip — Figma: 85×600px -->
        <img src="../Shoply_meta_png/Guideline.png" alt="" style="width:85px; height:100%; object-fit:cover; flex-shrink:0;" />
        <!-- Camera content column -->
        <div class="sdk-col" style="flex:1; gap:32px; align-items:center; justify-content:center;">
          <img src="../Shoply_meta_png/CameraClear.png" alt="" style="width:160px; height:160px; object-fit:contain;" />
          <span class="sdk-body sdk-secondary">왼쪽에 물체를 배치해주세요.</span>
        </div>
      </div>

      <!-- ③ showCapturingScreen() — Figma 199:2680 ──────────
           capturePhoto() 호출 즉시 — 카메라 버튼 눌린 상태.
           flexBox(row, gap=32) {
             image(Guideline.png, FILL)
             flexBox(col, gap=32, center, flexGrow=1) {
               image(CameraColor.png, FILL)    ← 브랜드 그라디언트 카메라
               text("왼쪽에 물체를 배치해주세요.", BODY, SECONDARY)
             }
           }
      ──────────────────────────────────────────────────── -->
      <div id="screen-capturing" class="screen" style="width:100%; height:100%; flex-direction:row; gap:32px; align-items:center;">
        <img src="../Shoply_meta_png/Guideline.png" alt="" style="width:85px; height:100%; object-fit:cover; flex-shrink:0;" />
        <div class="sdk-col" style="flex:1; gap:32px; align-items:center; justify-content:center;">
          <img src="../Shoply_meta_png/CameraColor.png" alt="" style="width:160px; height:160px; object-fit:contain;" />
          <span class="sdk-body sdk-secondary">왼쪽에 물체를 배치해주세요.</span>
        </div>
      </div>

      <!-- ④ showCaptureCompleteScreen() — Figma 199:2863 ──
           ~2초 후 촬영 완료 — 가이드라인 없이 중앙 정렬.
           flexBox(col, gap=32, center, center) {
             image(CameraColor.png, FILL)
             text("사진 촬영이 완료되었습니다!", BODY, SECONDARY)
           }
      ──────────────────────────────────────────────────── -->
      <div id="screen-captured" class="screen" style="width:100%; height:100%; flex-direction:column; gap:32px; align-items:center; justify-content:center;">
        <img src="../Shoply_meta_png/CameraColor.png" alt="" style="width:160px; height:160px; object-fit:contain;" />
        <div style="background:rgba(255,255,255,.20); border-radius:999px; padding:12px 16px;">
          <span class="sdk-body" style="white-space:nowrap;">사진 촬영이 완료되었습니다!</span>
        </div>
      </div>

      <!-- ⑤ displayLoading() — Figma 199:3562 ───────────────
           flexBox(col, gap=32, center, center) {
             image(Loading.gif → Loading.json Lottie, FILL)   ← 150×150
             text("상품을 검색 중입니다.", BODY, SECONDARY)
           }
      ──────────────────────────────────────────────────── -->
      <div id="screen-loading" class="screen" style="width:100%; height:100%; flex-direction:column; gap:32px; align-items:center; justify-content:center;">
        <div id="lottie-loading" style="width:150px; height:150px; flex-shrink:0;"></div>
        <div style="background:rgba(255,255,255,.20); border-radius:999px; padding:12px 16px;">
          <span class="sdk-body" style="white-space:nowrap;">상품을 검색 중입니다.</span>
        </div>
      </div>

      <!-- ⑥ showSearchCompleteScreen() — Figma 199:3013 ────
           flexBox(col, gap=32, center, center) {
             image(search-color.png, FILL)   ← 160×160
             text("검색이 완료되었습니다!", BODY, SECONDARY)
           }
      ──────────────────────────────────────────────────── -->
      <div id="screen-searched" class="screen" style="width:100%; height:100%; flex-direction:column; gap:32px; align-items:center; justify-content:center;">
        <img src="../Shoply_meta_png/search-color.png" alt="" style="width:160px; height:160px; object-fit:contain;" />
        <div style="background:rgba(255,255,255,.20); border-radius:999px; padding:12px 16px;">
          <span class="sdk-body" style="white-space:nowrap;">검색이 완료되었습니다!</span>
        </div>
      </div>

      <!-- ⑦ displayResult() — MATCHED ─────────────────────
           flexBox(col, gap=12) {
             flexBox(padding=24, CARD) {
               image(url, sizePreset=FILL)
               flexBox(row, gap=8, crossAlign=CENTER) { icon(CHECKMARK_CIRCLE, FILLED) · text(headline, BODY) }
             }
             flexBox(row, gap=8) {
               flexBox(col, gap=4, padding=12, CARD, flexGrow=1) × 3 { text(store, BODY, SECONDARY) · text(price, HEADING) }
             }
           }
      ──────────────────────────────────────────────────── -->
      <div id="screen-matched" class="screen sdk-col gap12 w100">
        <div class="sdk-card sdk-col gap8">
          <div class="sdk-img">상품 이미지 (image url)</div>
          <div class="sdk-row gap8">
            <div class="sdk-icon">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.41-3-3 1.41-1.41L10 13.59l6.59-6.6L18 8.41l-8 8z"/>
              </svg>
            </div>
            <span class="sdk-body">민티아 드라이하드</span>
          </div>
        </div>
        <div class="sdk-price-row">
          <div class="sdk-price-card">
            <span class="sdk-meta sdk-secondary">쿠팡</span>
            <span class="sdk-heading" style="font-size:22px">₩1,200</span>
          </div>
          <div class="sdk-price-card">
            <span class="sdk-meta sdk-secondary">네이버</span>
            <span class="sdk-heading" style="font-size:22px">₩1,350</span>
          </div>
          <div class="sdk-price-card">
            <span class="sdk-meta sdk-secondary">G마켓</span>
            <span class="sdk-heading" style="font-size:22px">₩1,500</span>
          </div>
        </div>
      </div>

      <!-- ⑧ displayResult() — UNCERTAIN ───────────────────
           flexBox(col, gap=8, padding=24, CARD) {
             flexBox(row, gap=8, crossAlign=CENTER) { icon(I_CIRCLE, OUTLINE) · text(headline, BODY) }
             text("후보 N개 · 폰에서 선택", BODY, SECONDARY)
           }
      ──────────────────────────────────────────────────── -->
      <div id="screen-uncertain" class="screen sdk-card sdk-col gap8">
        <div class="sdk-row gap8">
          <div class="sdk-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
              <circle cx="12" cy="12" r="10"/>
              <path d="M12 8v4"/>
              <circle cx="12" cy="16.5" r=".5" fill="currentColor"/>
            </svg>
          </div>
          <span class="sdk-heading">민티아 드라이하드</span>
        </div>
        <span class="sdk-body sdk-secondary">후보 3개 · 폰에서 선택</span>
      </div>

      <!-- ⑨ displayResult() — RETRY_REQUIRED ─────────────
           flexBox(col, gap=8, padding=24, CARD) {
             flexBox(row, gap=8, crossAlign=CENTER) { icon(TWO_ARROWS_CLOCKWISE, OUTLINE) · text(HEADING) }
             text(message, BODY, SECONDARY)
           }
      ──────────────────────────────────────────────────── -->
      <div id="screen-retry" class="screen sdk-card sdk-col gap8">
        <div class="sdk-row gap8">
          <div class="sdk-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
              <path d="M23 4v6h-6"/>
              <path d="M1 20v-6h6"/>
              <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
            </svg>
          </div>
          <span class="sdk-heading">다시 촬영해주세요</span>
        </div>
        <span class="sdk-body sdk-secondary">상품이 잘 보이도록 밝은 곳에서 가까이 촬영해주세요.</span>
      </div>

      <!-- ⑩ displayResult() — ERROR ───────────────────────
           flexBox(col, gap=8, padding=24, CARD) {
             flexBox(row, gap=8, crossAlign=CENTER) { icon(EXCLAMATION_TRIANGLE, FILLED) · text(HEADING) }
             text(message, BODY, SECONDARY)
           }
      ──────────────────────────────────────────────────── -->
      <div id="screen-error" class="screen sdk-card sdk-col gap8">
        <div class="sdk-row gap8">
          <div class="sdk-icon">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 2 1 21h22L12 2zm0 4.24L20.3 19H3.7L12 6.24zM11 10v4h2v-4h-2zm0 6v2h2v-2h-2z"/>
            </svg>
          </div>
          <span class="sdk-heading">오류가 발생했어요</span>
        </div>
        <span class="sdk-body sdk-secondary">잠시 후 다시 시도해주세요.</span>
      </div>

    </div><!-- /.display-inner -->
  </div><!-- /.display -->

</div>

<script>
// Lottie loading animation — initialised once, plays whenever the tab is active.
const lottieAnim = lottie.loadAnimation({
  container: document.getElementById('lottie-loading'),
  renderer: 'svg',
  loop: true,
  autoplay: false,
  path: '../Animation/Loading.json',
});

function show(id, btn) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('screen-' + id).classList.add('active');
  btn.classList.add('active');
  // Play/pause Lottie based on active tab.
  if (id === 'loading') { lottieAnim.play(); }
  else { lottieAnim.pause(); }
}
</script>
</body>
</html>
